<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  />
</head>
<body>
  <div class="card">
    <!-- タイトルバー -->
    <div class="card__titlebar">
      <span class="card__title">ポモドーロタイマー</span>
      <div class="card__controls">
        <span>ー</span>
        <span>□</span>
        <span>✕</span>
      </div>
    </div>

    <div class="card__body">
      <!-- ステータス -->
      <div class="status-label" id="statusLabel">作業中</div>

      <!-- SVG 円形プログレスバー -->
      <div class="timer-ring" id="timerRing">
        <svg viewBox="0 0 220 220">
          <circle class="timer-ring__track" cx="110" cy="110" r="95" />
          <circle
            class="timer-ring__bar"
            id="progressBar"
            cx="110"
            cy="110"
            r="95"
            stroke-dasharray="596.9"
            stroke-dashoffset="0"
          />
        </svg>
        <div class="timer-ring__time" id="timeDisplay">25:00</div>
      </div>

      <!-- ボタン -->
      <div class="btn-group">
        <button class="btn btn--primary" id="btnStart">開始</button>
        <button class="btn btn--outline" id="btnReset">リセット</button>
      </div>
    </div>

    <!-- 進捗パネル -->
    <div class="progress-panel">
      <div class="progress-panel__title">今日の進捗</div>
      <div class="progress-panel__stats">
        <div class="stat">
          <div class="stat__value" id="completedCount">0</div>
          <div class="stat__label">完了</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="focusTime">0分</div>
          <div class="stat__label">集中時間</div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/timer_ui.js') }}"></script>
</body>
</html>
