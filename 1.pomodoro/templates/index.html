<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 ポモドーロタイマー</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #e94560;
            --accent-light: #ff6b81;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0b0;
            --xp-bar: #53d769;
            --gold: #ffd700;
            --streak-fire: #ff6348;
            --chart-bar: #e94560;
            --badge-locked: #2a2a4a;
            --success: #53d769;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2em;
            color: var(--accent);
        }

        /* Timer Section */
        .timer-section {
            text-align: center;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 5em;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .timer-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .timer-buttons button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .timer-buttons button:hover {
            transform: scale(1.05);
        }

        .btn-start {
            background: var(--accent);
            color: #fff;
        }

        .btn-pause {
            background: var(--gold);
            color: #1a1a2e;
        }

        .btn-reset {
            background: var(--text-secondary);
            color: #1a1a2e;
        }

        /* XP Section */
        .xp-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95em;
        }

        .xp-text {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .xp-bar-outer {
            background: #2a2a4a;
            border-radius: 10px;
            height: 18px;
            overflow: hidden;
        }

        .xp-bar-inner {
            background: linear-gradient(90deg, var(--xp-bar), #2ecc71);
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
            min-width: 2px;
        }

        /* Streak */
        .streak-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .streak-item .streak-number {
            font-size: 2.2em;
            font-weight: 700;
        }

        .streak-item .streak-label {
            color: var(--text-secondary);
            font-size: 0.85em;
        }

        /* Badges */
        .badges-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .badges-section h2 {
            margin-bottom: 14px;
            font-size: 1.2em;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }

        .badge-card {
            text-align: center;
            padding: 14px 8px;
            border-radius: 12px;
            background: var(--bg-card);
            transition: transform 0.2s;
        }

        .badge-card:hover {
            transform: translateY(-3px);
        }

        .badge-card.locked {
            background: var(--badge-locked);
            opacity: 0.5;
        }

        .badge-icon {
            font-size: 2em;
            margin-bottom: 6px;
        }

        .badge-card.locked .badge-icon {
            filter: grayscale(1);
        }

        .badge-name {
            font-size: 0.75em;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .badge-card.locked .badge-name {
            color: var(--text-secondary);
        }

        /* Stats */
        .stats-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-section h2 {
            margin-bottom: 14px;
            font-size: 1.2em;
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 140px;
            padding: 10px 0;
        }

        .chart-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            max-width: 40px;
            background: var(--chart-bar);
            border-radius: 6px 6px 0 0;
            transition: height 0.5s ease;
            min-height: 2px;
        }

        .chart-count {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .chart-label {
            font-size: 0.7em;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .monthly-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.6em;
            font-weight: 700;
            color: var(--accent-light);
        }

        .stat-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            transform: translateX(120%);
            transition: transform 0.4s ease;
            z-index: 100;
        }

        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 ポモドーロタイマー</h1>
        </header>

        <!-- Timer -->
        <div class="timer-section">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-buttons">
                <button class="btn-start" id="btnStart" onclick="startTimer()">スタート</button>
                <button class="btn-pause" id="btnPause" onclick="pauseTimer()" style="display:none;">一時停止</button>
                <button class="btn-reset" onclick="resetTimer()">リセット</button>
            </div>
        </div>

        <!-- XP -->
        <div class="xp-section" id="xpSection">
            <div class="xp-header">
                <span class="level-badge" id="levelBadge">Lv.1</span>
                <span class="xp-text" id="xpText">0 / 100 XP</span>
            </div>
            <div class="xp-bar-outer">
                <div class="xp-bar-inner" id="xpBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Streak -->
        <div class="streak-section">
            <div class="streak-item">
                <div class="streak-number">🔥 <span id="currentStreak">0</span></div>
                <div class="streak-label">連続日数</div>
            </div>
            <div class="streak-item">
                <div class="streak-number">🏅 <span id="bestStreak">0</span></div>
                <div class="streak-label">最高記録</div>
            </div>
        </div>

        <!-- Badges -->
        <div class="badges-section">
            <h2>🏆 バッジコレクション</h2>
            <div class="badge-grid" id="badgeGrid"></div>
        </div>

        <!-- Stats -->
        <div class="stats-section">
            <h2>📊 週間統計</h2>
            <div class="chart-container" id="weeklyChart"></div>
            <div class="monthly-stats" id="monthlyStats"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Timer state
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let isRunning = false;
        const POMODORO_MINUTES = 25;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnPause').style.display = 'inline-block';

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById('btnStart').style.display = 'inline-block';
                    document.getElementById('btnPause').style.display = 'none';
                    completePomodoro();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('btnStart').style.display = 'inline-block';
            document.getElementById('btnPause').style.display = 'none';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timerSeconds = POMODORO_MINUTES * 60;
            updateTimerDisplay();
            document.getElementById('btnStart').style.display = 'inline-block';
            document.getElementById('btnPause').style.display = 'none';
        }

        async function completePomodoro() {
            try {
                const res = await fetch('/api/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration_minutes: POMODORO_MINUTES })
                });
                const data = await res.json();

                showNotification(`+${data.xp_earned} XP 獲得！`);

                if (data.new_badges && data.new_badges.length > 0) {
                    setTimeout(() => {
                        showNotification(`🏆 新バッジ: ${data.new_badges.join(', ')}`);
                    }, 2000);
                }

                loadGamification();
                loadStats();
                resetTimer();
            } catch (e) {
                console.error('Error completing pomodoro:', e);
            }
        }

        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        async function loadGamification() {
            try {
                const res = await fetch('/api/gamification');
                const data = await res.json();

                // XP
                document.getElementById('levelBadge').textContent = `Lv.${data.level}`;
                const xpInLevel = data.xp % 100;
                document.getElementById('xpText').textContent = `${xpInLevel} / 100 XP`;
                document.getElementById('xpBar').style.width = `${xpInLevel}%`;

                // Streak
                document.getElementById('currentStreak').textContent = data.streak.current_streak;
                document.getElementById('bestStreak').textContent = data.streak.best_streak;

                // Badges
                const grid = document.getElementById('badgeGrid');
                grid.innerHTML = '';
                data.badges.forEach(b => {
                    const card = document.createElement('div');
                    card.className = `badge-card ${b.earned ? '' : 'locked'}`;
                    card.innerHTML = `
                        <div class="badge-icon">${b.icon}</div>
                        <div class="badge-name">${b.name}</div>
                    `;
                    card.title = b.description;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error('Error loading gamification:', e);
            }
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // Weekly chart
                const chart = document.getElementById('weeklyChart');
                chart.innerHTML = '';
                const maxSessions = Math.max(...data.weekly.map(d => d.sessions), 1);
                const days = ['日', '月', '火', '水', '木', '金', '土'];

                data.weekly.forEach(d => {
                    const date = new Date(d.date + 'T00:00:00');
                    const dayName = days[date.getDay()];
                    const heightPct = (d.sessions / maxSessions) * 100;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'chart-bar-wrapper';
                    wrapper.innerHTML = `
                        <span class="chart-count">${d.sessions}</span>
                        <div class="chart-bar" style="height: ${heightPct}%;"></div>
                        <span class="chart-label">${dayName}</span>
                    `;
                    chart.appendChild(wrapper);
                });

                // Monthly stats
                const monthly = document.getElementById('monthlyStats');
                monthly.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${data.monthly.total_sessions}</div>
                        <div class="stat-label">今月のセッション</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.monthly.average_duration}分</div>
                        <div class="stat-label">平均集中時間</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.monthly.completion_rate}%</div>
                        <div class="stat-label">達成率</div>
                    </div>
                `;
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        // Init
        updateTimerDisplay();
        loadGamification();
        loadStats();
    </script>
</body>
</html>
