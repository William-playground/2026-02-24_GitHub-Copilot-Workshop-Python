<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #7c3aed 50%, #6366f1 100%);
            overflow: hidden;
            position: relative;
        }

        /* ── Particle Canvas ── */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 340px;
            padding: 0;
            overflow: hidden;
        }

        /* ── Title Bar ── */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 8px;
        }
        .title-bar h1 {
            font-size: 18px;
            font-weight: 700;
            color: #1e1b4b;
        }
        .window-controls {
            display: flex;
            gap: 8px;
        }
        .window-controls span {
            display: inline-block;
            width: 14px;
            height: 14px;
            line-height: 14px;
            text-align: center;
            font-size: 11px;
            color: #a5a5a5;
            border: 1px solid #d4d4d4;
            border-radius: 3px;
            cursor: default;
        }

        /* ── Main Content ── */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 30px 30px;
        }

        /* ── Status Label ── */
        #statusLabel {
            font-size: 16px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 20px;
            transition: color 0.4s;
        }

        /* ── Timer Ring ── */
        .timer-ring-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 24px;
        }
        .timer-ring-wrapper svg {
            transform: rotate(-90deg);
            width: 200px;
            height: 200px;
        }
        .ring-bg {
            fill: none;
            stroke: #e5e7eb;
            stroke-width: 12;
        }
        .ring-progress {
            fill: none;
            stroke: #6366f1;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease, stroke 0.6s ease;
        }
        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 700;
            color: #1e1b4b;
            letter-spacing: 2px;
            transition: color 0.6s ease;
        }

        /* ── Buttons ── */
        .buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
        }
        .btn {
            padding: 10px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
        }
        .btn-start {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }
        .btn-start:hover {
            background: #4f46e5;
            border-color: #4f46e5;
        }
        .btn-reset {
            background: #fff;
            color: #6366f1;
            border-color: #6366f1;
        }
        .btn-reset:hover {
            background: #eef2ff;
        }

        /* ── Progress Section ── */
        .progress-section {
            width: 100%;
            background: #f3f4f6;
            border-radius: 0 0 20px 20px;
            padding: 20px 30px;
        }
        .progress-section h2 {
            font-size: 14px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 12px;
        }
        .progress-stats {
            display: flex;
            justify-content: space-around;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #6366f1;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        /* ── Ripple effect on button click ── */
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }
        .btn { position: relative; overflow: hidden; }
        .btn .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            width: 40px; height: 40px;
            pointer-events: none;
            animation: ripple 0.6s ease-out forwards;
        }
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="card">
    <!-- Title Bar -->
    <div class="title-bar">
        <h1>ポモドーロタイマー</h1>
        <div class="window-controls">
            <span>ー</span><span>□</span><span>×</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div id="statusLabel">作業中</div>

        <!-- SVG Circular Progress Ring -->
        <div class="timer-ring-wrapper">
            <svg viewBox="0 0 200 200">
                <circle class="ring-bg" cx="100" cy="100" r="85"></circle>
                <circle id="progressRing" class="ring-progress" cx="100" cy="100" r="85"></circle>
            </svg>
            <div id="timerDisplay" class="timer-display">25:00</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button id="btnStart" class="btn btn-start" onclick="toggleTimer()">開始</button>
            <button id="btnReset" class="btn btn-reset" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <!-- Progress Tracker -->
    <div class="progress-section">
        <h2>今日の進捗</h2>
        <div class="progress-stats">
            <div class="stat">
                <div id="completedCount" class="stat-value">0</div>
                <div class="stat-label">完了</div>
            </div>
            <div class="stat">
                <div id="totalFocusTime" class="stat-value">0分</div>
                <div class="stat-label">集中時間</div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    /* ════════════════════════════════════════
       Constants & State
       ════════════════════════════════════════ */
    const WORK_MINUTES = 25;
    const BREAK_MINUTES = 5;

    const CIRCUMFERENCE = 2 * Math.PI * 85;            // circle r=85

    let totalSeconds   = WORK_MINUTES * 60;
    let remaining      = totalSeconds;
    let isRunning      = false;
    let isWorkSession  = true;
    let completedCount = 0;
    let totalFocusSec  = 0;
    let timerInterval  = null;

    /* DOM refs */
    const progressRing   = document.getElementById('progressRing');
    const timerDisplay   = document.getElementById('timerDisplay');
    const statusLabel    = document.getElementById('statusLabel');
    const btnStart       = document.getElementById('btnStart');
    const completedEl    = document.getElementById('completedCount');
    const focusTimeEl    = document.getElementById('totalFocusTime');

    /* Initialise SVG ring */
    progressRing.style.strokeDasharray  = CIRCUMFERENCE;
    progressRing.style.strokeDashoffset = '0';

    /* ════════════════════════════════════════
       Color Interpolation  (Blue → Yellow → Red)
       ════════════════════════════════════════ */
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return [r, g, b];
    }

    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function interpolateColor(color1, color2, t) {
        const [r1, g1, b1] = hexToRgb(color1);
        const [r2, g2, b2] = hexToRgb(color2);
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        return rgbToHex(r, g, b);
    }

    const COLOR_BLUE   = '#6366f1';
    const COLOR_YELLOW = '#eab308';
    const COLOR_RED    = '#ef4444';

    function getProgressColor(pct) {
        // pct = percentage remaining (1.0 → 0.0)
        if (pct > 0.5) {
            return COLOR_BLUE;
        } else if (pct > 0.25) {
            // transition blue → yellow  (0.5 → 0.25)
            const t = 1 - (pct - 0.25) / 0.25;
            return interpolateColor(COLOR_BLUE, COLOR_YELLOW, t);
        } else {
            // transition yellow → red  (0.25 → 0)
            const t = 1 - pct / 0.25;
            return interpolateColor(COLOR_YELLOW, COLOR_RED, t);
        }
    }

    /* ════════════════════════════════════════
       Timer Logic
       ════════════════════════════════════════ */
    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return m + ':' + s;
    }

    function updateDisplay() {
        const pct = remaining / totalSeconds;

        /* Timer text */
        timerDisplay.textContent = formatTime(remaining);

        /* Ring offset (0 = full, CIRCUMFERENCE = empty) */
        const offset = CIRCUMFERENCE * (1 - pct);
        progressRing.style.strokeDashoffset = offset;

        /* Color */
        if (isWorkSession) {
            const color = getProgressColor(pct);
            progressRing.style.stroke = color;
        } else {
            progressRing.style.stroke = '#22c55e';   /* green for break */
        }
    }

    function tick() {
        if (!isRunning) return;

        if (remaining > 0) {
            remaining--;
            if (isWorkSession) totalFocusSec++;
            updateDisplay();
            updateStats();
        } else {
            /* Session complete */
            if (isWorkSession) {
                completedCount++;
                updateStats();
                switchSession(false);
            } else {
                switchSession(true);
            }
        }
    }

    function switchSession(toWork) {
        isWorkSession = toWork;
        totalSeconds  = (toWork ? WORK_MINUTES : BREAK_MINUTES) * 60;
        remaining     = totalSeconds;
        statusLabel.textContent = toWork ? '作業中' : '休憩中';
        updateDisplay();
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.textContent = '開始';
        } else {
            isRunning = true;
            btnStart.textContent = '一時停止';
            timerInterval = setInterval(tick, 1000);
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        btnStart.textContent = '開始';
        switchSession(true);
    }

    function updateStats() {
        completedEl.textContent = completedCount;
        if (totalFocusSec >= 3600) {
            const h = Math.floor(totalFocusSec / 3600);
            const m = Math.floor((totalFocusSec % 3600) / 60);
            focusTimeEl.textContent = h + '時間' + m + '分';
        } else {
            focusTimeEl.textContent = Math.floor(totalFocusSec / 60) + '分';
        }
    }

    /* Expose to inline onclick handlers */
    window.toggleTimer = toggleTimer;
    window.resetTimer  = resetTimer;

    /* Initial render */
    updateDisplay();

    /* ════════════════════════════════════════
       Particle / Background Effects (Canvas)
       ════════════════════════════════════════ */
    const canvas = document.getElementById('particleCanvas');
    const ctx    = canvas.getContext('2d');
    let particles = [];
    const MAX_PARTICLES = 50;

    function resizeCanvas() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function Particle() {
        this.x      = Math.random() * canvas.width;
        this.y      = Math.random() * canvas.height;
        this.radius = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = (Math.random() - 0.5) * 0.6;
        this.alpha  = Math.random() * 0.5 + 0.1;
    }

    /* Seed initial particles */
    for (let i = 0; i < MAX_PARTICLES; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        /* Determine target opacity: full during work + running, faded otherwise */
        const showFull = isRunning && isWorkSession;

        particles.forEach(function (p) {
            const alpha = showFull ? p.alpha : (p.alpha * 0.15);

            p.x += p.speedX;
            p.y += p.speedY;

            /* Wrap around edges */
            if (p.x < -10) p.x = canvas.width + 10;
            if (p.x > canvas.width + 10) p.x = -10;
            if (p.y < -10) p.y = canvas.height + 10;
            if (p.y > canvas.height + 10) p.y = -10;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
            ctx.fill();
        });

        requestAnimationFrame(animateParticles);
    }

    animateParticles();

    /* ── Button ripple effect ── */
    document.querySelectorAll('.btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            const rect = btn.getBoundingClientRect();
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            circle.style.left = (e.clientX - rect.left - 20) + 'px';
            circle.style.top  = (e.clientY - rect.top - 20)  + 'px';
            btn.appendChild(circle);
            setTimeout(function () { circle.remove(); }, 600);
        });
    });

})();
</script>

</body>
</html>
